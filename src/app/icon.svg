<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Vinyl Champion logo option</title>
  <desc id="desc">A polished vinyl record badge with three podiums, winning music notes, and three star markers.</desc>
  <defs>
    <radialGradient id="record" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#182236"/>
      <stop offset=".42" stop-color="#111827"/>
      <stop offset=".72" stop-color="#172033"/>
      <stop offset="1" stop-color="#070b16"/>
    </radialGradient>
    <linearGradient id="label" x1="378" y1="370" x2="822" y2="814" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3abff0"/>
      <stop offset=".52" stop-color="#f8c33a"/>
      <stop offset="1" stop-color="#fb7a2f"/>
    </linearGradient>
    <linearGradient id="gold" x1="506" y1="438" x2="700" y2="914" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe991"/>
      <stop offset=".55" stop-color="#ffc233"/>
      <stop offset="1" stop-color="#e18a00"/>
    </linearGradient>
    <linearGradient id="silver" x1="326" y1="570" x2="492" y2="914" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fafc"/>
      <stop offset=".55" stop-color="#cdd7e3"/>
      <stop offset="1" stop-color="#8a9bad"/>
    </linearGradient>
    <linearGradient id="bronze" x1="708" y1="632" x2="888" y2="914" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffbd7a"/>
      <stop offset=".55" stop-color="#f48638"/>
      <stop offset="1" stop-color="#c84a12"/>
    </linearGradient>
    <symbol id="note" viewBox="0 0 128 176">
      <path d="M82 9v98c0 29-23 52-54 52-18 0-28-9-28-23 0-21 24-38 53-38 6 0 12 1 17 3V29l58-20v32L82 56z" fill="currentColor"/>
    </symbol>
    <symbol id="star" viewBox="0 0 100 96">
      <path d="M50 0l14 31 34 4-25 23 7 34-30-17-30 17 7-34L2 35l34-4z" fill="currentColor"/>
    </symbol>
  </defs>
  <rect width="1200" height="1200" fill="#f8fafc"/>
  <circle cx="600" cy="600" r="500" fill="url(#record)"/>
  <circle cx="600" cy="600" r="404" fill="none" stroke="#233049" stroke-width="24"/>
  <circle cx="600" cy="600" r="318" fill="none" stroke="#0c1220" stroke-width="18" opacity=".65"/>
  <circle cx="600" cy="600" r="236" fill="url(#label)"/>
  <circle cx="600" cy="600" r="74" fill="#f8fafc"/>
  <circle cx="600" cy="600" r="28" fill="#0f172a"/>
  <g opacity=".30" fill="#000">
    <rect x="516" y="514" width="228" height="410" rx="36"/>
    <rect x="326" y="626" width="188" height="298" rx="36"/>
    <rect x="734" y="686" width="188" height="238" rx="36"/>
  </g>
  <path d="M250 914h700" stroke="#f8fafc" stroke-width="28" stroke-linecap="round"/>
  <rect x="492" y="490" width="228" height="410" rx="36" fill="url(#gold)"/>
  <rect x="302" y="602" width="188" height="298" rx="36" fill="url(#silver)"/>
  <rect x="710" y="662" width="188" height="238" rx="36" fill="url(#bronze)"/>
  <path d="M302 744h596" stroke="#0f172a" stroke-width="18" opacity=".12"/>
  <use href="#note" x="538" y="308" width="132" height="181" color="#ffffff"/>
  <use href="#note" x="350" y="502" width="92" height="127" color="#ffffff"/>
  <use href="#note" x="758" y="560" width="88" height="121" color="#ffffff"/>
  <use href="#star" x="510" y="182" width="50" height="48" color="#fde047"/>
  <use href="#star" x="574" y="158" width="64" height="62" color="#fde047"/>
  <use href="#star" x="648" y="182" width="50" height="48" color="#fde047"/>
</svg>
